name: Build MacMTP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macmtp-main
  cancel-in-progress: true
jobs:
  package:
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and verify Apple Silicon package
        run: bash package.sh
      - uses: actions/upload-artifact@v7
        with:
          path: dist/MacMTP.zip
          archive: false
          if-no-files-found: error
